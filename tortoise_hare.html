<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>The Tortoise and the Hare Race</title>
        <link rel="stylesheet" href="style.css" />
        <!-- script tag for the JS file -->
        <script src="race.js" defer></script>
    </head>

    <body>
        <h1>The Tortoise 🐢 and the Hare 🐇</h1>
        <p class="description">
            Click “Start Race” and watch the animals race across the track!
        </p>

        <div class="controls">
            <button id="startBtn">Start Race</button>
        </div>
        <div id="score-board">
            <h2>Scores</h2>
            <p id="tortoise-win-count">Torsoise:</p>
            <p id="hare-win-count">Hare:</p>
        </div>
        <div class="track-wrapper">
            <div id="message"></div>
            <div id="track" class="track"></div>
        </div>
    </body>
</html>
